[project]
name = "deako-simulator"
version = "0.1.0"
description = "Deako Hub and Device Simulator for Home Assistant integration testing"
authors = [{name = "GitHub Copilot", email = "noreply@github.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "zeroconf>=0.131.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.2.0",
]

[project.scripts]
deako-simulator = "deako_simulator.cli:main"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deako_simulator*"]
exclude = ["tests*", "specs*", "custom_components*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=deako_simulator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--timeout=5",
]
markers = [
    "manual: marks tests as requiring manual validation (e.g., mDNS discovery)",
    "slow: marks tests as slow (taking >1 minute to complete)",
]

[tool.coverage.run]
source = ["deako_simulator"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
